name: release

# Push a tag like v1.2.0 (matching the version in pyproject.toml) to publish:
# tests (here on Windows and Ubuntu, macOS via the tests workflow) -> build -> PyPI (trusted publishing, no token) -> GitHub Release + official MCP Registry (GitHub OIDC, no token).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # macOS is checked through the tests workflow below: GitHub's macOS arm64 runners are sometimes so scarce
        # that a queued job is cancelled after 15 minutes, which used to cancel the whole release.
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  tests-workflow-passed:
    # The tests workflow runs on every push, the tag included, on Windows and macOS. Wait for it to pass on this exact
    # commit. If GitHub cancels its macOS jobs for lack of runners, rerun them there, then rerun this job.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the tests workflow on ${{ github.sha }}
        run: |
          set -euo pipefail
          while true; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
                    --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')"
            echo "$runs"
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then
              echo "The tests workflow passed on this commit, macOS included."
              exit 0
            fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' > /dev/null; then
              echo "::error::The tests workflow didn't pass on this commit. Rerun its failed jobs, then rerun this job."
              exit 1
            fi
            sleep 60
          done

  build:
    needs: [test, tests-workflow-passed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package and server.json versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          srv="$(python -c 'import json; d=json.load(open("server.json")); print(d["version"], d["packages"][0]["version"])')"
          echo "tag=$tag pyproject=$pkg server.json=$srv"
          test "$tag" = "$pkg"
          test "$srv" = "$tag $tag"
          grep -q "mcp-name: $(python -c 'import json; print(json.load(open("server.json"))["name"])')" README.md
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anycubic-slicer-mcp/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Directories such as Glama rebuild on every GitHub Release, not on tags.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Wait for PyPI to serve the new version
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/anycubic-slicer-mcp/$v/json")"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "PyPI never served version $v" >&2
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
